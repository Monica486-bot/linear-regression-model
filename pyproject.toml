[project]
name = "student-grade-prediction"
version = "1.0.0"
description = "Student final grade prediction using linear regression and ensemble models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "notebook>=7.2.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
